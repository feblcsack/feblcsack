<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07021a"/>
      <stop offset="1" stop-color="#101a45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="0.55" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#9beaff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.65" stop-color="#1c0a45"/>
      <stop offset="1" stop-color="#5a1a7a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bfe6ff"/>
      <stop offset="0.5" stop-color="#5ca7ec"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ffb0"/>
      <stop offset="1" stop-color="#2fbf4a"/>
    </linearGradient>
    <pattern id="deskgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5ce1ff" stroke-width="1" opacity="0.18"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#5ce1ff" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screenclip"><rect x="52" y="60" width="796" height="208"/></clipPath>
  </defs>

  <!-- desktop background: dark so the window pops -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#deskgrid)"/>

  <!-- window glow -->
  <rect x="40" y="20" width="820" height="260" fill="#5ce1ff" opacity="0.7" filter="url(#glow)"/>
  <!-- hard offset shadow -->
  <rect x="54" y="34" width="820" height="260" fill="#ff5fb8"/>
  <rect x="54" y="34" width="820" height="260" fill="none" stroke="#000" stroke-width="2"/>

  <!-- window frame -->
  <rect x="40" y="20" width="820" height="260" fill="#d4d0c8" stroke="#000" stroke-width="2"/>
  <path d="M41 21H859M41 21V279" stroke="#fff" stroke-width="3"/>
  <path d="M41 279H859M859 21V279" stroke="#404040" stroke-width="3"/>

  <!-- title bar -->
  <rect x="45" y="25" width="810" height="28" fill="url(#title)"/>
  <rect x="45" y="25" width="810" height="12" fill="#fff" opacity="0.22"/>
  <text x="56" y="45" font-family="'Trebuchet MS', Verdana, Tahoma, sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#fff">feblcsack.exe</text>

  <!-- window buttons -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000">
    <rect x="791" y="30" width="18" height="18" fill="#d4d0c8" stroke="#fff" stroke-width="2"/>
    <path d="M809 30V48H791" fill="none" stroke="#404040" stroke-width="2"/>
    <text x="796" y="44">_</text>
    <rect x="813" y="30" width="18" height="18" fill="#d4d0c8" stroke="#fff" stroke-width="2"/>
    <path d="M831 30V48H813" fill="none" stroke="#404040" stroke-width="2"/>
    <text x="817" y="44">□</text>
    <rect x="835" y="30" width="18" height="18" fill="#ff8a8a" stroke="#fff" stroke-width="2"/>
    <path d="M853 30V48H835" fill="none" stroke="#7a0000" stroke-width="2"/>
    <text x="840" y="44">x</text>
  </g>

  <!-- screen -->
  <rect x="52" y="60" width="796" height="208" fill="url(#screen)"/>
  <rect x="52" y="60" width="796" height="208" fill="url(#grid)"/>

  <!-- soft perspective floor -->
  <g clip-path="url(#screenclip)" stroke="#5ce1ff" stroke-width="1" opacity="0.28">
    <path d="M450 205 L-250 268"/><path d="M450 205 L-100 268"/><path d="M450 205 L50 268"/>
    <path d="M450 205 L200 268"/><path d="M450 205 L350 268"/><path d="M450 205 L450 268"/>
    <path d="M450 205 L550 268"/><path d="M450 205 L700 268"/><path d="M450 205 L850 268"/>
    <path d="M450 205 L1000 268"/><path d="M450 205 L1150 268"/>
    <path d="M52 212H848"/><path d="M52 220H848"/><path d="M52 230H848"/>
    <path d="M52 243H848"/><path d="M52 258H848"/>
  </g>

  <!-- screen bevel -->
  <path d="M52 60H848M52 60V268" stroke="#404040" stroke-width="3"/>
  <path d="M52 268H848M848 60V268" stroke="#fff" stroke-width="3"/>

  <!-- header text -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="76" y="86" font-size="14" fill="#8fe3ff">C:\&gt; welcome to</text>
  </g>
  <g font-family="'Trebuchet MS', Verdana, Tahoma, sans-serif" font-weight="bold" font-style="italic">
    <text x="78" y="124" font-size="38" fill="#ff5fb8" stroke="#ff5fb8" stroke-width="4" stroke-linejoin="round" opacity="0.75">feblcsack's corner</text>
    <text x="76" y="122" font-size="38" fill="url(#chrome)" stroke="#0a0221" stroke-width="3" stroke-linejoin="round" paint-order="stroke">feblcsack's corner</text>
  </g>
  <text x="76" y="142" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#bebbbb">best viewed on computer_</text>

  <!-- loading bar -->
  <g>
    <rect x="700" y="76" width="128" height="18" fill="#d4d0c8"/>
    <path d="M700 76H828M700 76V94" stroke="#404040" stroke-width="2"/>
    <path d="M700 94H828M828 76V94" stroke="#fff" stroke-width="2"/>
    <g fill="url(#bar)">
      <rect x="704" y="80" width="12" height="10"/><rect x="718" y="80" width="12" height="10"/>
      <rect x="732" y="80" width="12" height="10"/><rect x="746" y="80" width="12" height="10"/>
      <rect x="760" y="80" width="12" height="10"/><rect x="774" y="80" width="12" height="10"/>
      <rect x="788" y="80" width="12" height="10"/><rect x="802" y="80" width="12" height="10"/>
    </g>
  </g>

  <!-- neofetch -->
  <text x="76" y="168" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#8fe3ff">C:\&gt; neofetch<tspan fill="#fff">_</tspan></text>

  <!-- ascii logo -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#5ce1ff" xml:space="preserve">
    <text x="76" y="188">.-------------.</text>
    <text x="76" y="201">| C:\&gt; fc_     |</text>
    <text x="76" y="214">|             |</text>
    <text x="76" y="227">|   ~ y2k ~   |</text>
    <text x="76" y="240">'-------------'</text>
    <text x="76" y="253" fill="#ff5fb8">  _[_______]_</text>
  </g>

  <!-- info -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" xml:space="preserve">
    <text x="250" y="188"><tspan fill="#ff5fb8">feblcsack</tspan><tspan fill="#fff">@</tspan><tspan fill="#ff5fb8">corner</tspan></text>
    <text x="250" y="201" fill="#8a7fb0">------------------</text>
    <text x="250" y="214"><tspan fill="#5ce1ff">OS</tspan><tspan fill="#fff">:     Corner OS 2000</tspan></text>
    <text x="250" y="227"><tspan fill="#5ce1ff">Host</tspan><tspan fill="#fff">:   GitHub</tspan></text>
    <text x="250" y="240"><tspan fill="#5ce1ff">Shell</tspan><tspan fill="#fff">:  bash</tspan></text>
    <text x="250" y="253"><tspan fill="#5ce1ff">Uptime</tspan><tspan fill="#fff">: since forever</tspan></text>
  </g>

  <!-- color palette -->
  <g>
    <rect x="520" y="204" width="20" height="14" fill="#000080"/>
    <rect x="540" y="204" width="20" height="14" fill="#ff5fb8"/>
    <rect x="560" y="204" width="20" height="14" fill="#5ce1ff"/>
    <rect x="580" y="204" width="20" height="14" fill="#b8ff5c"/>
    <rect x="520" y="218" width="20" height="14" fill="#ffd45c"/>
    <rect x="540" y="218" width="20" height="14" fill="#a06bff"/>
    <rect x="560" y="218" width="20" height="14" fill="#c0c0c0"/>
    <rect x="580" y="218" width="20" height="14" fill="#ffffff"/>
  </g>

  <!-- scanlines over screen -->
  <rect x="52" y="60" width="796" height="208" fill="url(#scan)"/>
</svg>
