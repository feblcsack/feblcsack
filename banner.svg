<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#5ca7ec"/>
    </linearGradient>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000"/>
      <rect width="2" height="2" fill="#0b1a2b"/>
      <rect x="2" y="2" width="2" height="2" fill="#0b1a2b"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- desktop background -->
  <rect width="900" height="220" fill="url(#dither)"/>
  <g fill="#5ca7ec">
    <rect x="40" y="24" width="4" height="4"/><rect x="120" y="180" width="4" height="4"/>
    <rect x="800" y="30" width="4" height="4"/><rect x="860" y="150" width="4" height="4"/>
    <rect x="700" y="196" width="4" height="4"/><rect x="24" y="120" width="4" height="4"/>
  </g>

  <!-- window shadow -->
  <rect x="64" y="34" width="780" height="160" fill="#000"/>
  <!-- window frame -->
  <rect x="60" y="30" width="780" height="160" fill="#c0c0c0"/>
  <path d="M60 30H840M60 30V190" stroke="#fff" stroke-width="2"/>
  <path d="M60 190H840M840 30V190" stroke="#404040" stroke-width="2"/>

  <!-- title bar -->
  <rect x="64" y="34" width="772" height="24" fill="url(#title)"/>
  <text x="74" y="52" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#fff">feblcsack.exe</text>

  <!-- window buttons -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000">
    <rect x="768" y="38" width="16" height="16" fill="#c0c0c0" stroke="#fff"/>
    <text x="772" y="51">_</text>
    <rect x="788" y="38" width="16" height="16" fill="#c0c0c0" stroke="#fff"/>
    <text x="792" y="51">□</text>
    <rect x="808" y="38" width="16" height="16" fill="#c0c0c0" stroke="#fff"/>
    <text x="812" y="51">x</text>
  </g>

  <!-- screen area (inset) -->
  <rect x="72" y="66" width="756" height="112" fill="#000"/>
  <path d="M72 66H828M72 66V178" stroke="#404040" stroke-width="2"/>
  <path d="M72 178H828M828 66V178" stroke="#fff" stroke-width="2"/>

  <!-- text -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="96" y="104" font-size="16" fill="#5ca7ec">C:\&gt; welcome to</text>
    <text x="96" y="146" font-size="40" fill="#fff">feblcsack's corner</text>
    <text x="96" y="168" font-size="14" fill="#bebbbb">best viewed on computer_</text>
  </g>

  <!-- scanlines over screen -->
  <rect x="72" y="66" width="756" height="112" fill="url(#scan)"/>
</svg>
